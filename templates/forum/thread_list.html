<!doctype html>
<html>
<head><meta charset="utf-8"><title>Threads — {{ course.title }}</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="p-6 max-w-3xl mx-auto">
  <h1 class="text-2xl font-semibold mb-4">Threads — {{ course.title }}</h1>
   <div class="mb-4">
  <button
    type="button"
    class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-white shadow hover:shadow-md text-gray-700"
    onclick="(function(){
      try {
        var r = document.referrer;
        if (r && new URL(r).origin === location.origin) { history.back(); }
        else { location.href = '{% url 'accounts:student_dashboard' %}'; }
      } catch(e) {
        location.href = '{% url 'accounts:student_dashboard' %}';
      }
    })()"
  >
    ← Back
  </button>

  <noscript>
    <a href="{% url 'accounts:student_dashboard' %}"
       class="inline-block ml-2 text-blue-600 hover:text-blue-800 underline">
      Back
    </a>
  </noscript>
</div>

  <a class="bg-sky-600 text-white px-3 py-1 rounded" href="{% url 'forum:thread_create' course.id %}">
    New thread
  </a>

  <ul class="mt-4 space-y-2">
    {% for t in threads %}
      <li class="border rounded p-3">
        <a class="text-sky-700 underline" href="{% url 'forum:thread_detail' t.id %}">{{ t.title }}</a>
        <div class="text-sm text-gray-600">by {{ t.author.username }} • {{ t.replies_count }} replies</div>
      </li>
    {% empty %}
      <li class="text-gray-600">No threads yet.</li>
    {% endfor %}
  </ul>
</body>
</html>
