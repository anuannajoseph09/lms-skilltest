<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Discussion | {{ course.title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

  <div class="bg-white rounded-xl shadow-md p-8 w-full max-w-2xl">
    <h1 class="text-2xl font-semibold text-[#068DAA] mb-2">
      Start a Discussion
    </h1>
    <p class="text-gray-600 mb-6">
      Course: <span class="font-medium">{{ course.title }}</span>
    </p>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
        <input
          type="text"
          name="title"
          placeholder="Enter a short title for your question"
          required
          class="w-full border-gray-300 rounded-lg shadow-sm focus:border-[#068DAA] focus:ring-[#068DAA] p-2"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
        <textarea
          name="body"
          rows="6"
          placeholder="Describe your issue or question in detail..."
          required
          class="w-full border-gray-300 rounded-lg shadow-sm focus:border-[#068DAA] focus:ring-[#068DAA] p-2"
        ></textarea>
      </div>

      <div class="flex items-center justify-between">
        <a
          href="{% url 'forum:thread_list' course.id %}"
          class="text-[#068DAA] hover:underline text-sm font-medium"
        >
          ← Back to Discussions
        </a>
        <button
          type="submit"
          class="bg-[#068DAA] hover:bg-[#056e88] text-white font-medium px-5 py-2 rounded-lg transition"
        >
          Post Thread
        </button>
      </div>
    </form>
  </div>

</body>
</html>
