<!doctype html>
<html>
<head><meta charset="utf-8"><title>Course Forum — {{ course.title }}</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="p-6 max-w-3xl mx-auto">
  <h1 class="text-2xl font-semibold mb-4">Forum (Instructor) — {{ course.title }}</h1>

  <ul class="space-y-2">
    {% for t in threads %}
      <li class="border rounded p-3 flex items-center justify-between">
        <div>
          <a class="text-sky-700 underline" href="{% url 'forum:instructor_thread_detail' t.id %}">{{ t.title }}</a>
          <div class="text-sm text-gray-600">by {{ t.author.username }} • {{ t.replies_count }} replies</div>
        </div>
        <form action="{% url 'forum:delete_thread' t.id %}" method="post">
          {% csrf_token %}
          <button class="text-red-600 hover:underline" type="submit">Delete</button>
        </form>
      </li>
    {% empty %}
      <li class="text-gray-600">No threads yet.</li>
    {% endfor %}
  </ul>
</body>
</html>
