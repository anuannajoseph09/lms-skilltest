<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Categories</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="container mx-auto px-6 py-8">

    <div class="flex items-center justify-between mb-6">
       <div class="mb-4">
  <button
    type="button"
    class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-white shadow hover:shadow-md text-gray-700"
    onclick="(function(){
      try {
        var r = document.referrer;
        if (r && new URL(r).origin === location.origin) { history.back(); }
        else { location.href = '{% url 'adminpanel:ap_dashboard' %}'; }
      } catch(e) {
        location.href = '{% url 'adminpanel:ap_dashboard' %}';
      }
    })()"
  >
    ← Back
  </button>

  <noscript>
    <a href="{% url 'adminpanel:ap_dashboard' %}"
       class="inline-block ml-2 text-blue-600 hover:text-blue-800 underline">
      Back
    </a>
  </noscript>
</div>
      <h1 class="text-3xl font-bold text-gray-800">Categories</h1>
      <a href="{% url 'adminpanel:ap_category_create' %}"
         class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        + New Category
      </a>
    </div>

    <form class="mb-6 flex gap-2">
      <input name="q" value="{{ q }}" placeholder="Search categories…"
             class="w-full max-w-md px-4 py-2 border rounded-l focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button class="px-4 py-2 bg-blue-600 text-white rounded-r hover:bg-blue-700">Search</button>
    </form>

    <div class="overflow-x-auto bg-white shadow rounded">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Slug</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          {% for c in categories %}
            <tr class="hover:bg-gray-50">
              <td class="px-6 py-3 text-gray-800">{{ c.name }}</td>
              <td class="px-6 py-3 text-gray-600">{{ c.slug }}</td>
              <td class="px-6 py-3">
                <a href="{% url 'adminpanel:ap_category_delete' c.id %}" class="text-red-600 hover:text-red-800">
                  Delete
                </a>
              </td>
            </tr>
          {% empty %}
            <tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">No categories.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <p class="mt-6">
      <a href="{% url 'adminpanel:ap_course_list' %}" class="text-indigo-700 hover:underline">← Back to Courses</a>
    </p>

  </div>
</body>
</html>
