<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instructor Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background:#f8f9fa; }
      .sidebar {
        width:250px;
        background:#0c6c57;
        color:#fff;
        position:fixed;
        top:0; bottom:0; left:0;
        padding:20px 15px;
      }
      .sidebar a {
        display:block;
        color:#d1d5db;
        text-decoration:none;
        margin:8px 0;
        padding:8px 10px;
        border-radius:8px;
      }
      .sidebar a.active, .sidebar a:hover {
        background:#87b6b3;
        color:#fff;
      }
      .content { margin-left:270px; padding:25px; }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h4 class="fw-bold text-white mb-4">Instructor</h4>
      <a href="{% url 'instructor-dashboard' %}" class="{% if request.resolver_match.url_name == 'instructor-dashboard' %}active{% endif %}">🏠 Dashboard</a>
      <a href="{% url 'my_courses' %}">📚 My Courses</a>
      <a href="{% url 'course_create' %}">➕ Create Course</a>
      <a href="{% url 'instructor_profile' %}">👤 Profile</a>
      <a href="{% url 'logout' %}">🚪 Logout</a>
    </div>

    <div class="content">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}

      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
