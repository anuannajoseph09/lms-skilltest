<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instructor Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background:#f8f9fa; }
      .sidebar {
        width:250px;
        background:#0c6c57;
        color:#fff;
        position:fixed;
        top:0; bottom:0; left:0;
        padding:20px 15px;
      }
      .sidebar h4 {
        font-weight:700;
        font-size:1.25rem;
      }
      .sidebar a {
        display:block;
        color:#d1d5db;
        text-decoration:none;
        margin:8px 0;
        padding:8px 10px;
        border-radius:8px;
        font-weight:500;
      }
      .sidebar a.active, .sidebar a:hover {
        background:#87b6b3;
        color:#fff;
      }
      .content {
        margin-left:270px;
        padding:25px;
      }
      .logout-btn {
        color:black !important;
      }
      .logout-btn:hover {
        background:#b52d3a;
        color:#fff !important;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <h4 class="text-white mb-4">Instructor</h4>

      <!-- Dashboard -->
      <a href="{% url 'courses:instructor_dashboard' %}"
         class="{% if request.resolver_match.url_name == 'instructor_dashboard' %}active{% endif %}">
         🏠 Dashboard
      </a>

      <!-- My Courses -->
      <a href="{% url 'courses:instructor_my_courses' %}"
         class="{% if request.resolver_match.url_name == 'instructor_my_courses' %}active{% endif %}">
         📚 My Courses
      </a>

      <!-- Create Course -->
      <a href="{% url 'courses:course_create' %}"
         class="{% if request.resolver_match.url_name == 'course_create' %}active{% endif %}">
         ➕ Create Course
      </a>

      <!-- Profile -->
      <a href="{% url 'accounts:instructor_profile' %}"
         class="{% if request.resolver_match.url_name == 'instructor_profile' %}active{% endif %}">
         👤 Profile
      </a>
           

      <!-- Logout -->
 <form method="post" action="{% url 'accounts:logout' %}" class="inline">
  {% csrf_token %}
  <button type="submit" class="logout-btn">🚪 Logout</button>
</form>
    </div>

    <!-- Main Content -->
    <div class="content">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}

      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
