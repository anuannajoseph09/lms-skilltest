<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if quiz %}
            Edit Quiz: {{ quiz.title }}
        {% else %}
            New Quiz for {{ course.title }}
        {% endif %}
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-auto p-6 bg-white rounded-lg shadow-lg">
        <h3 class="text-2xl font-bold text-gray-800 mb-6 text-center">
            {% if quiz %}
                Edit Quiz: {{ quiz.title }}
            {% else %}
                New Quiz for {{ course.title }}
            {% endif %}
        </h3>
        <form method="post" class="space-y-6">
            {% csrf_token %}
<div class="mb-4">
  <button
    type="button"
    class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-white shadow hover:shadow-md text-gray-700"
    onclick="(function(){
      try {
        var r = document.referrer;
        if (r && new URL(r).origin === location.origin) { history.back(); }
        else { location.href = '{% url 'courses:instructor_dashboard' %}'; }
      } catch(e) {
        location.href = '{% url 'courses:instructor_dashboard' %}';
      }
    })()"
  >
    ← Back
  </button>

  <noscript>
    <a href="{% url 'courses:instructor_dashboard' %}"
       class="inline-block ml-2 text-blue-600 hover:text-blue-800 underline">
      Back
    </a>
  </noscript>
</div>


                <label for="id_title" class="block text-sm font-medium text-gray-700">Quiz Title</label>
                
                <input type="text" name="title" id="id_title" value="{{ form.title.value|default:'' }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Enter quiz title" required>
                {% if form.title.errors %}
                    <p class="mt-1 text-sm text-red-600">{{ form.title.errors|first }}</p>
                {% endif %}
            </div>
            <button type="submit" class="w-full py-2 px-4 bg-indigo-600 text-white font-semibold rounded-md shadow hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Save</button>
        </form>
    </div>
</body>
</html>
