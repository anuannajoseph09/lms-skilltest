<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for form inputs to ensure visibility */
        form p {
            margin-bottom: 1rem;
        }
        form input[type="text"],
        form input[type="file"],
        form textarea,
        form select {
            width: 100%;
            padding: 0.5rem;
            border: 2px solid #d1d5db; /* Gray-300 for clear visibility */
            border-radius: 0.375rem;
            background-color: #f9fafb; /* Light background for contrast */
            font-size: 1rem;
            color: #1f2937; /* Dark text for readability */
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        form input[type="text"]:focus,
        form input[type="file"]:focus,
        form textarea:focus,
        form select:focus {
            outline: none;
            border-color: #2563eb; /* Blue-600 for focus state */
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        form label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151; /* Gray-700 for labels */
            margin-bottom: 0.25rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">
    <div class="w-full max-w-md mx-auto p-6 bg-white/80 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-3xl font-bold text-gray-700 mb-6 text-center">{{ title }}</h2>
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="flex justify-center space-x-4">
                <button type="submit" 
                        class="bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-300">
                    Save
                </button>
                <a href="{% url 'courses:my_courses' %}" 
                   class="inline-block bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 transition duration-300">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</body>
</html>
