<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if question %}
            Edit Option for {{ question.text|truncatechars:30 }}
        {% else %}
            New Option for {{ quiz.title }}
        {% endif %}
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-auto p-6 bg-white rounded-lg shadow-lg">
        <h3 class="text-2xl font-bold text-gray-800 mb-6 text-center">
            {% if question %}
                Edit Option for {{ question.text|truncatechars:30 }}
            {% else %}
                New Option for {{ quiz.title }}
            {% endif %}
        </h3>
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="id_text" class="block text-sm font-medium text-gray-700">Option Text</label>
                <input type="text" name="text" id="id_text" value="{{ form.text.value|default:'' }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Enter option text" required>
                {% if form.text.errors %}
                    <p class="mt-1 text-sm text-red-600">{{ form.text.errors|first }}</p>
                {% endif %}
            </div>
            <div>
                <label for="id_is_correct" class="block text-sm font-medium text-gray-700">Is Correct</label>
                <select name="is_correct" id="id_is_correct" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    <option value="True" {% if form.is_correct.value|default:"False" == "True" %}selected{% endif %}>Yes</option>
                    <option value="False" {% if form.is_correct.value|default:"False" == "False" %}selected{% endif %}>No</option>
                </select>
                {% if form.is_correct.errors %}
                    <p class="mt-1 text-sm text-red-600">{{ form.is_correct.errors|first }}</p>
                {% endif %}
            </div>
            <button type="submit" class="w-full py-2 px-4 bg-indigo-600 text-white font-semibold rounded-md shadow hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Save</button>
        </form>
    </div>
</body>
</html>
