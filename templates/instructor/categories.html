<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">
    <div class="w-full max-w-2xl mx-auto p-6 bg-white/80 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-3xl font-bold text-gray-700 mb-6 text-center">Categories</h2>
        <p class="mb-4 text-center">
            <a href="{% url 'category_create' %}" 
               class="inline-block bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-300">
                + New Category
            </a>
            <span class="text-gray-400 mx-2">|</span>
            <a href="{% url 'my_courses' %}" 
               class="inline-block bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 transition duration-300">
                My Courses
            </a>
        </p>
        <ul class="space-y-3">
            {% for x in items %}
                <li class="p-3 bg-gray-50 rounded-md shadow-sm hover:bg-gray-100 transition duration-200 text-gray-700">
                    {{ x.name }}
                </li>
            {% empty %}
                <li class="p-3 text-gray-500 italic text-center">None</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
