<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Create Your Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">
  <div class="bg-white rounded-xl shadow p-8 w-full max-w-md text-center">
    <h1 class="text-2xl font-semibold mb-6">Create Your Account</h1>
    <p class="text-gray-600 mb-6">Select your role to continue:</p>

    <div class="space-y-3">
      <a href="{% url 'accounts:student_signup' %}" class="block w-full bg-[#068DAA] text-white py-3 rounded-lg hover:opacity-90">
        Register as Student
      </a>
      <a href="{% url 'accounts:instructor_signup' %}" class="block w-full border border-[#068DAA] text-[#068DAA] py-3 rounded-lg hover:bg-[#068DAA] hover:text-white">
        Register as Instructor
      </a>
    </div>

    <p class="mt-6 text-sm">
      Already have an account?
      <a class="text-[#068DAA] underline" href="{% url 'accounts:login' %}">Login</a>
    </p>
  </div>
</body>
</html>
