<!DOCTYPE html>
<html>
<head>
  <title>Login | LMS</title>
  <style>
    body { font-family: Arial; background: #f7f7f7; text-align: center; margin-top: 60px; }
    form { display: inline-block; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input { width: 250px; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    button { background: #068DAA; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #056b81; }
  </style>
</head>
<body>
  <h2>Login to LMS</h2>

  {% if form.errors %}
  <p style="color: red;">Invalid username or password.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}
      <input type="hidden" name="next" value="{{ next }}">
    {% endif %}
    <button type="submit">Login</button>
  </form>

  <p style="margin-top:20px;">
    <a href="/">Back to Home</a>
  </p>
</body>
</html>
