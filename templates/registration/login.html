<!DOCTYPE html>
<html>
<head>
  <title>Login | LMS</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%);
      text-align: center;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    form {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      max-width: 350px;
      width: 100%;
      transition: transform 0.3s ease;
    }
    form:hover {
      transform: translateY(-5px);
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #068DAA;
      box-shadow: 0 0 8px rgba(6, 141, 170, 0.3);
    }
    button {
      background: #068DAA;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      transition: background 0.3s ease, transform 0.2s ease;
      width: 100%;
    }
    button:hover {
      background: #055b70;
      transform: scale(1.05);
    }
    button:active {
      transform: scale(0.95);
    }
    .error-message {
      color: #d32f2f;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: 500;
    }
    .home-link {
      margin-top: 25px;
      display: inline-block;
      text-decoration: none;
      color: #068DAA;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .home-link:hover {
      color: #055b70;
      text-decoration: underline;
    }
    h2 {
      color: #333;
      font-size: 28px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .input-container {
      position: relative;
      margin: 15px 0;
    }
    .input-container label {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #666;
      font-size: 16px;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .input-container input:focus + label,
    .input-container input:not(:placeholder-shown) + label {
      top: -10px;
      left: 10px;
      font-size: 12px;
      color: #068DAA;
      background: white;
      padding: 0 5px;
    }
  </style>
  <!-- (keep your CSS as-is) -->
</head>
<body>
  <!-- ✅ Post to the named login url and include CSRF -->
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <h2>Login to LMS</h2>

    {% if form.errors %}
      <div class="error-message">Invalid username or password.</div>
    {% endif %}

    <div class="input-container">
      <input type="text" name="username" id="username" placeholder=" " required>
      <label for="username">Username</label>
    </div>

    <div class="input-container">
      <input type="password" name="password" id="password" placeholder=" " required>
      <label for="password">Password</label>
    </div>

    <!-- ✅ send them through the redirect router after login -->
    <input type="hidden" name="next" value="{% url 'redirect_after_login' %}">
    <button type="submit">Login</button>

    <p><a href="/" class="home-link">Back to Home</a></p>
  </form>
</body>
</html>
