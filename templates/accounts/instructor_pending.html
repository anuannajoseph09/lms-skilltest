<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Instructor Approval Pending</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow w-full max-w-lg text-center">
    <h1 class="text-2xl font-semibold mb-4">Thanks, {{ request.user.username }}!</h1>
    <p class="text-gray-700 mb-6">
      Your instructor account is
      <strong>not approved by the admin</strong>.
      You can log out now and sign back in later.
    </p>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button class="bg-gray-800 text-white px-4 py-2 rounded">Logout</button>
    </form>
  </div>
</body>
</html>
